services:
  db:
    image: postgres:16
    container_name: order_fulfillment_db
    environment:
      POSTGRES_DB: order_fulfillment_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d order_fulfillment_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    container_name: order_fulfillment_api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:${POSTGRES_PASSWORD_URLENCODED}@db:5432/order_fulfillment_db
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_DAYS: 7
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: